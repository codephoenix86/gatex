# Bind address for the public gateway HTTP server.
listen_address: ":8080"

# Defaults apply unless a route provides an override.
timeouts:
  request: 15s
  dial: 2s
  tls_handshake: 3s
  response_header: 5s
  idle_connection: 90s

rate_limit:
  requests_per_second: 50
  burst: 100

# Clients send credentials in X-API-Key. Replace this example credential before
# protecting production routes; multiple keys permit a no-downtime rotation.
auth:
  api_keys:
    - change-me-before-deployment

cors:
  allowed_origins:
    - https://app.example.com
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
  allowed_headers:
    - Content-Type
    - X-API-Key
    - X-Request-ID
  exposed_headers:
    - X-Request-ID
  allow_credentials: false
  max_age: 10m

backend_pools:
  users:
    strategy: round_robin # round_robin or least_connections
    health_check:
      path: /healthz
      interval: 10s
      timeout: 2s
    circuit_breaker:
      failure_threshold: 5
      open_timeout: 30s
      half_open_max_requests: 2
    backends:
      - url: http://users-1:8080
      - url: http://users-2:8080
  orders:
    strategy: least_connections
    circuit_breaker:
      failure_threshold: 5
      open_timeout: 30s
      half_open_max_requests: 2
    backends:
      - url: http://orders-1:8080

routes:
  - path_prefix: /api/users
    backend_pool: users
    # A route can override the global rate limit.
    rate_limit:
      requests_per_second: 20
      burst: 40
  - path_prefix: /api/orders
    backend_pool: orders
    protected: true
